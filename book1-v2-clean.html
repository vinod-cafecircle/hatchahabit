<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hatch a Habit — Book 1: BELIEVE</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #111827;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-family: "Nunito", sans-serif;
}

/* TOP BAR */
.topbar {
  height: 44px;
  background: #0F172A;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.tb-brand {
  font-family: "Fredoka One", cursive;
  font-size: 15px;
  color: #FDD835;
  letter-spacing: 0.5px;
}
.tb-title {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.5px;
}
.tb-fs {
  background: none;
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-family: "Nunito", sans-serif;
  transition: all 0.15s;
}
.tb-fs:hover { border-color: #FDD835; color: #FDD835; }

/* STAGE */
.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 12px 60px;
}

/* BOOK */
.book {
  position: relative;
  width: 100%;
  max-width: min(960px, calc((100vh - 96px) * 960 / 540));
  aspect-ratio: 960/540;
}

/* SLIDE VIEWPORT */
.viewport {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.4), 0 32px 72px rgba(0,0,0,0.5);
}

/* TRACK */
.track {
  display: flex;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}

/* SLIDE */
.slide {
  flex-shrink: 0;
  width: 100%;
  height: 100%;
  position: relative;
  background: white;
}
.slide svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* SIDE ARROWS */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px; height: 42px;
  border-radius: 50%;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  z-index: 10;
  user-select: none;
  backdrop-filter: blur(6px);
}
.arrow:hover { background: rgba(253,216,53,0.25); border-color: #FDD835; color: #FDD835; }
.arrow.off { opacity:0; pointer-events:none; }
.arrow-l { left: 8px; }
.arrow-r { right: 8px; }

/* BOTTOM BAR */
.bottombar {
  height: 52px;
  background: #0F172A;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-shrink: 0;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.nb {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.6);
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.nb:hover:not(:disabled) { background: rgba(253,216,53,0.15); border-color: #FDD835; color: #FDD835; }
.nb:disabled { opacity:0.2; cursor:default; }

.prog-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 200px;
}
.prog-track {
  width: 100%; height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, #4CAF82, #FDD835);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.prog-txt {
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.5px;
}
/* FULLSCREEN */
:fullscreen .topbar, :-webkit-full-screen .topbar,
:-moz-full-screen .topbar, :-ms-fullscreen .topbar { display: none !important; }

:fullscreen .bottombar, :-webkit-full-screen .bottombar,
:-moz-full-screen .bottombar, :-ms-fullscreen .bottombar { display: none !important; }

:fullscreen .stage, :-webkit-full-screen .stage,
:-moz-full-screen .stage, :-ms-fullscreen .stage {
  padding: 8px !important;
}
:fullscreen .book, :-webkit-full-screen .book,
:-moz-full-screen .book, :-ms-fullscreen .book {
  max-width: min(calc(100vh * 16/9), 100vw) !important;
}

/* ── PERSONALISATION SCREEN ── */
.pers-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #1A237E 0%, #0D47A1 50%, #1565C0 100%);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Nunito", sans-serif;
}
.pers-card {
  background: white;
  border-radius: 20px;
  padding: 40px 48px;
  width: min(560px, 92vw);
  box-shadow: 0 32px 80px rgba(0,0,0,0.4);
  position: relative;
}
.pers-kev {
  position: absolute;
  top: -56px;
  left: 50%;
  transform: translateX(-50%);
  width: 96px;
  height: 96px;
  background: #FFB800;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  font-size: 44px;
}
.pers-title {
  font-family: "Fredoka One", cursive;
  font-size: 26px;
  color: #1A237E;
  text-align: center;
  margin: 24px 0 4px;
}
.pers-sub {
  font-size: 14px;
  color: #90A4AE;
  text-align: center;
  margin-bottom: 28px;
}
.pers-group {
  margin-bottom: 20px;
}
.pers-toggle-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  cursor: pointer;
}
.pers-checkbox {
  width: 20px; height: 20px;
  accent-color: #1A237E;
  cursor: pointer;
  flex-shrink: 0;
}
.pers-toggle-label {
  font-weight: 700;
  font-size: 14px;
  color: #1A237E;
  cursor: pointer;
}
.pers-input-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-left: 32px;
}
.pers-input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid #E0E0E0;
  border-radius: 10px;
  font-family: "Nunito", sans-serif;
  font-size: 14px;
  color: #1A237E;
  outline: none;
  transition: border-color 0.15s;
}
.pers-input:focus { border-color: #1565C0; }
.pers-pronoun-row {
  display: flex;
  gap: 8px;
}
.pers-pronoun-btn {
  flex: 1;
  padding: 8px;
  border: 1.5px solid #E0E0E0;
  border-radius: 8px;
  background: none;
  font-family: "Nunito", sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: #607D8B;
  cursor: pointer;
  transition: all 0.15s;
}
.pers-pronoun-btn.selected {
  border-color: #1A237E;
  background: #E8EAF6;
  color: #1A237E;
}
.pers-divider {
  height: 1px;
  background: #F0F0F0;
  margin: 20px 0;
}
.pers-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #1A237E, #1565C0);
  border: none;
  border-radius: 12px;
  color: white;
  font-family: "Fredoka One", cursive;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(26,35,126,0.3);
  letter-spacing: 0.5px;
}
.pers-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(26,35,126,0.4);
}
.pers-skip {
  display: block;
  text-align: center;
  margin-top: 12px;
  font-size: 12px;
  color: #B0BEC5;
  cursor: pointer;
  text-decoration: underline;
}
.pers-skip:hover { color: #607D8B; }
.field-hidden { display: none; }

</style>
</head>

  <text font-family="Patrick Hand, cursive" font-size="32" fill="#5D4037" x="56" y="344">"What if," thought Kev,</text>

  <text font-family="Patrick Hand, cursive" font-size="28" fill="#5D4037" x="56" y="446">Just fourteen mornings.</text>

  <button class="nb" id="bFirst" title="First" onclick="go(0)">&#8676;</button>
  <button class="nb" id="bPrev"  title="Prev"  onclick="prev()">&#8592;</button>
  <div class="prog-wrap">
    <div class="prog-track" onclick="scrub(event)">
      <div class="prog-fill" id="pFill"></div>
    </div>
    <div class="prog-txt" id="pTxt"></div>
  </div>
  <button class="nb" id="bNext" title="Next" onclick="next()">&#8594;</button>
  <button class="nb" id="bLast" title="Last" onclick="go(TOTAL-1)">&#8677;</button>
</div>

<script>
const TOTAL = 52;
let cur = 0, busy = false;

const track  = document.getElementById('track');
const pFill  = document.getElementById('pFill');
const pTxt   = document.getElementById('pTxt');
const tbTitle= document.getElementById('tbTitle');
const aL     = document.getElementById('aL');
const aR     = document.getElementById('aR');
const bFirst = document.getElementById('bFirst');
const bPrev  = document.getElementById('bPrev');
const bNext  = document.getElementById('bNext');
const bLast  = document.getElementById('bLast');

function go(idx) {
  idx = Math.max(0, Math.min(TOTAL-1, idx));
  cur = idx;
  track.style.transform = `translateX(-${cur * 100}%)`;
  update();
}
function next() { if (cur < TOTAL-1) go(cur+1); }
function prev() { if (cur > 0)       go(cur-1); }

function update() {
  pFill.style.width = ((cur/(TOTAL-1))*100)+'%';
  pTxt.textContent  = (cur+1)+' / '+TOTAL;

  const labels = ['Cover','Dedication'];
  const slides = track.querySelectorAll('.slide[data-label]');
  slides.forEach(s => labels.push(s.dataset.label));
  tbTitle.textContent = labels[cur] || '';

  aL.classList.toggle('off', cur===0);
  aR.classList.toggle('off', cur===TOTAL-1);
  bFirst.disabled = bPrev.disabled = cur===0;
  bNext.disabled  = bLast.disabled  = cur===TOTAL-1;
}

function scrub(e) {
  const r = e.currentTarget.getBoundingClientRect();
  go(Math.round(((e.clientX-r.left)/r.width)*(TOTAL-1)));
}

function toggleFS() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }
}

// Update fullscreen button label
document.addEventListener('fullscreenchange', updateFSBtn);
document.addEventListener('webkitfullscreenchange', updateFSBtn);
function updateFSBtn() {
  const btn = document.querySelector('.tb-fs');
  const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
  btn.textContent = isFS ? '✕ Exit Fullscreen' : '⛶ Fullscreen';
}

document.addEventListener('keydown', e => {
  // Don't intercept keys when typing in form inputs
  const tag = document.activeElement.tagName.toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ([' ','ArrowRight','ArrowDown'].includes(e.key)) { e.preventDefault(); next(); }
  if (['ArrowLeft','ArrowUp'].includes(e.key))        { e.preventDefault(); prev(); }
  if (e.key==='Home') go(0);
  if (e.key==='End')  go(TOTAL-1);
  if (e.key.toLowerCase()==='f') toggleFS();
});

let tx=0;
document.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',   e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40) dx<0?next():prev();
});


// ── PERSONALISATION ──
let childName = '';
let pronoun = 'she';
let dedicationMsg = '';
let certDate = '';

// Set default date to today
document.getElementById('certDate').valueAsDate = new Date();

function toggleField(fieldId, checkId) {
  // Small delay to let checkbox update first
  setTimeout(() => {
    const checked = document.getElementById(checkId).checked;
    const field = document.getElementById(fieldId);
    if (checked) field.classList.remove('field-hidden');
    else field.classList.add('field-hidden');
  }, 10);
}

function selectPronoun(p, btn) {
  pronoun = p;
  document.querySelectorAll('.pers-pronoun-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function applyPersonalisation() {
  const nameChecked        = document.getElementById('nameCheck').checked;
  const dedicationChecked  = document.getElementById('dedicationCheck').checked;
  const dateChecked        = document.getElementById('dateCheck').checked;

  childName     = nameChecked       ? document.getElementById('childName').value.trim()    : '';
  dedicationMsg = dedicationChecked ? document.getElementById('dedicationMsg').value.trim() : '';
  certDate      = dateChecked       ? document.getElementById('certDate').value             : '';

  // ── 1. Certificate — replace "write your name here" with child name ──
  if (childName) {
    const certSlide = track.children[track.children.length - 1];
    if (certSlide) {
      certSlide.innerHTML = certSlide.innerHTML
        .replace('write your name here', childName)
        .replace('fill="#9E9E9E"', 'fill="#1A237E" font-weight="bold"')
        .replace('font-size="20"', 'font-size="24"');
    }
  }

  // ── 2. Affirmation pages — replace "Kev X and said…" with "Kev and [Name] said…" ──
  if (childName) {
    const phrases = [
      { from: 'Kev puffed up proudly and said…',      to: `Kev and ${childName} said…` },
      { from: 'Kev nodded wisely and said…',           to: `Kev and ${childName} said…` },
      { from: 'Kev stood up straight and said…',       to: `Kev and ${childName} said…` },
      { from: 'Kev spread his wings wide and said…',   to: `Kev and ${childName} said…` },
      { from: 'Kev grinned his biggest grin and said…',to: `Kev and ${childName} said…` },
      { from: 'Kev watched the stars appear and said…',to: `Kev and ${childName} said…` },
      { from: 'Kev laughed his loudest laugh and said…',to:`Kev and ${childName} said…` },
      { from: 'Kev stretched wide and said…',          to: `Kev and ${childName} said…` },
      { from: 'Kev took a deep breath and said…',      to: `Kev and ${childName} said…` },
    ];

    for (let i = 2; i < track.children.length; i++) {
      const slide = track.children[i];
      if (slide.dataset && slide.dataset.label && slide.dataset.label.includes('AFFIRMATION')) {
        let html = slide.innerHTML;
        phrases.forEach(p => { html = html.split(p.from).join(p.to); });
        slide.innerHTML = html;
      }
    }
  }

  // ── 3. Custom dedication on copyright page ──
  if (dedicationMsg) {
    const copySlide = track.children[1];
    if (copySlide) {
      copySlide.innerHTML = copySlide.innerHTML
        .split('For every little one who is').join(dedicationMsg.substring(0, 38))
        .split('learning that their voice').join(dedicationMsg.substring(38, 76))
        .split('matters.').join(dedicationMsg.length > 76 ? dedicationMsg.substring(76) : '')
        .split('And for the grown-ups who').join('')
        .split('read this with them. 💛').join('');
    }
  }

  // ── 4. Certificate date ──
  if (certDate) {
    const certSlide = track.children[track.children.length - 1];
    if (certSlide) {
      const d = new Date(certDate + 'T00:00:00');
      const formatted = d.toLocaleDateString('en-AU', { day:'numeric', month:'long', year:'numeric' });
      certSlide.innerHTML = certSlide.innerHTML
        .split('has completed 14 days of morning habits')
        .join('has completed 14 days of morning habits — ' + formatted);
    }
  }
}

function openBook() {
  applyPersonalisation();
  document.getElementById('persOverlay').style.display = 'none';
  go(0);
}

function skipPersonalisation() {
  document.getElementById('persOverlay').style.display = 'none';
  go(0);
}

go(0);
</script>
