  <text font-family="Patrick Hand, cursive" font-size="32" fill="white" x="56" y="200">Kev looked at his wings.</text>
  <text font-family="Patrick Hand, cursive" font-size="32" fill="#FDECC8" x="56" y="248">Brown and cream. Ordinary.</text>
  <text font-family="Patrick Hand, cursive" font-size="32" fill="white" x="56" y="320">He took a big breath</text>
  <text font-family="Patrick Hand, cursive" font-size="32" fill="white" x="56" y="364">and thought…</text>
  <text font-family="Fredoka One, cursive" font-size="44" fill="#FDD835" x="56" y="434">What if I tried?</text>
